<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAK Absensi | {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        #sidebar-wrapper { min-height: 100vh; width: 250px; background-color: #212529; }
        .sidebar-heading { padding: 1.5rem 1.25rem; font-size: 1.5rem; color: white; border-bottom: 1px solid #4f5b66; }
        .list-group-item { background-color: #212529; color: #adb5bd; border: none; font-size: 0.95rem; }
        .list-group-item:hover { background-color: #343a40; color: white; }
        .list-group-item.active { background-color: #0d6efd !important; color: white; }
        /* Gaya tambahan untuk status timer */
        .status-badge { font-size: 1.1rem; padding: 0.5rem 1rem; }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div class="sidebar-heading">SIAK Absensi</div>
            <div class="list-group list-group-flush">
                <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard Live
                </a>
                <a href="{{ url_for('manage_kelas_page') }}" class="list-group-item list-group-item-action">
                    <i class="fas fa-chalkboard-teacher me-2"></i> Buat/Kelola Kelas
                </a>
                <a href="{{ url_for('select_class_form') }}" class="list-group-item list-group-item-action">
                    <i class="fas fa-calendar-check me-2"></i> Mulai Absensi
                </a>
                <a href="{{ url_for('rekap_absensi') }}" class="list-group-item list-group-item-action">
                    <i class="fas fa-book me-2"></i> Rekap Absensi
                </a>
                <a href="{{ url_for('enroll_mahasiswa') }}" class="list-group-item list-group-item-action">
                    <i class="fas fa-user-plus me-2"></i> Pendaftaran Mhs
                </a>
            </div>
        </div>
        <div id="page-content-wrapper" style="width: 100%;">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <h4 class="ms-3 mb-0">{% block header %}{% endblock %}</h4>
            </nav>

            <div class="container-fluid pt-4">
                {% block content %}{% endblock %}
            </div>
        </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block script %}
    {% endblock %}
    
</body>
</html>
